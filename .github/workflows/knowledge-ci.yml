name: Knowledge Base CI

on:
  # push = main ONLY. A branch push used to ALSO fire this workflow while the
  # pull_request event fired it again for the same commit — two identical runs
  # (2 × 14 jobs) per push, competing for the same runners. Branch coverage comes
  # from the pull_request trigger below; main covers post-merge.
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'knowledge-base/**'
      - 'governance/**'
      - 'architecture/**'
      - 'agents/**'
      - 'commands/**'
      - 'templates/**'
      - 'evals/**'
      - '.claude-plugin/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'manifests/**'
      - 'runtime-evidence/**'
      - 'audits/**'
      - 'docs/**'
      - 'deliverables/**'
      - 'memory/**'
      - 'marketing/**'
      - 'README.md'
      - 'CLAUDE.md'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'knowledge-base/**'
      - 'governance/**'
      - 'architecture/**'
      - 'agents/**'
      - 'commands/**'
      - 'templates/**'
      - 'evals/**'
      - '.claude-plugin/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'manifests/**'
      - 'runtime-evidence/**'
      - 'audits/**'
      - 'docs/**'
      - 'deliverables/**'
      - 'memory/**'
      - 'marketing/**'
      - 'README.md'
      - 'CLAUDE.md'

# One live run per ref. A new push supersedes the previous run for the same
# branch/PR instead of queueing behind it — without this, superseded runs sat
# `queued` forever and starved the current commit's checks (25 July 2026: 3 runs
# × 14 jobs stuck 25+ min, zero ever reaching in_progress).
# main is exempt from cancellation: a post-merge run must always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate-skills:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x evals/*.sh

      - name: Validate SKILL.md files
        run: bash evals/validate-skills.sh

  validate-charters:
    name: Validate App Institutional Charters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x evals/*.sh

      - name: Validate C-100→C-115 charters
        run: bash evals/validate-charters.sh

  validate-structure:
    name: Validate Structure & Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x evals/*.sh

      - name: Validate repo structure + plugin.json
        run: bash evals/validate-structure.sh

  check-knowledge-gaps:
    name: Check Knowledge Gaps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x evals/*.sh

      - name: Detect knowledge gaps
        run: bash evals/check-knowledge-gaps.sh

  check-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x evals/*.sh

      - name: Verify relative Markdown links resolve
        run: bash evals/check-links.sh

  check-registry-integrity:
    name: Registry Integrity Check (v2.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Make scripts executable
        run: chmod +x evals/*.sh scripts/*.py

      - name: Regenerate Asset Registry
        run: python3 scripts/build-asset-registry.py

      - name: Verify No Manual Edits to Registry
        run: |
          if ! git diff --exit-code -I '^# Generated:' architecture/asset-registry.yaml; then
            echo "❌ FAIL: asset-registry.yaml has manual edits that conflict with auto-generation."
            echo "   Either revert your manual edits OR commit the regenerated version."
            echo "   Run: python3 scripts/build-asset-registry.py"
            exit 1
          fi

      - name: Run Registry Integrity Engine v2.0
        run: bash evals/check-registry-integrity.sh

      # The dependency graph is derived from the registry (C-118) and drifted
      # unnoticed until the 2026-09-24 audit (+187/−43). Same rule as above.
      - name: Regenerate Dependency Graph
        run: python3 scripts/regenerate-cdg.py

      - name: Verify Dependency Graph Matches Generator
        run: |
          if ! git diff --exit-code -I '^# Generated:' manifests/dependency-graph.yaml; then
            echo "❌ FAIL: manifests/dependency-graph.yaml is stale — the registry changed and the graph was not rebuilt."
            echo "   Run: python3 scripts/regenerate-cdg.py  (after build-asset-registry.py) and commit the result."
            exit 1
          fi


  check-authority-consistency:
    name: Authority Hierarchy Consistency (v3.5.0+)
