coverage_version: "1.0"
authority: C-96

# Required evidence coverage for current-state claims that are broad enough to
# otherwise be easy to state without a traceable record.
requirements:
  - id: RE-COV-001
    name: C-02 full-fleet Mainnet attestation
    binds_to_required: C-02
    allowed_kinds: [health_snapshot]
    min_non_example_records: 1
    # The only record today (ev-2026-07-16-024) is a documentation attestation of the fleet
    # REGISTRATION (app, Pi App ID, domain) — what this requirement checks. It says nothing
    # about whether the apps answer today; that needs telemetry (C-96), which no record has yet.
    allow_attestation: true
    # max_age_days: not set. Setting it today fails CI on the July record; set it together with
    # the first real probe of the fleet (owner/ops — this session's network cannot reach the apps).
    fleet_binding:
      source: architecture/app-fleet.yaml
      required_count: 24
      match_fields: [app, pi_app_id, domain]
