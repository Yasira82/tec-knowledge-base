# TEC Runtime Evidence Schema v1.0

> **Version:** v1.0 — June 2026 (Session 14.7)
> **Truth State:** `[Planned State]`
> **Governance State:** `[Governance Approved]`
> **Verification:** `[Documentation Verified]`
> **Authority Scope:** `[Platform]`
> **Parent Constitution:** C-96 Platform Runtime & Observability Constitution

---

## Purpose

C-96 declares **Runtime Evidence** a constitutional obligation:

> *"Operational runtimes must emit evidence before emitting conclusions."*
> *"A failure that produces no evidence cannot be verified (C-93); a failure that
>  cannot be verified cannot be governed (C-99). A silent runtime is an ungoverned runtime."*

This manifest is the **contract** that makes that obligation machine-checkable. It
defines the shape of a runtime evidence record so that every metric, incident,
SLO breach, or health snapshot the platform emits is:

- **attributable** to a source (Incident Evidence Principle),
- **bound** to the C-doc claim/obligation it pertains to (Runtime Visibility Principle),
- **consumable** by the Verification Engine (C-93) at verification tier **V-5
  Operational Authority** (VAM).

It closes the loop `Reality → Evidence → Governance`: the Drift Detection gates
assert *code matches the claims*; Runtime Evidence binds *live behavior back to the
same claims*.

```
CDG  →  WHAT documents exist
VAM  →  WHO verifies, at what tier (runtime evidence = V-5)
Drift →  code still matches the documented claims
Runtime Evidence  →  live behavior, attributable + bound to those claims
```

---

## Where evidence lives

```
runtime-evidence/
  examples/        # schema-validating samples (committed, illustrative)
  *.yaml           # real evidence records (emitted by ops tooling / incident flow)
```

Records are append-only facts (C-00: events are immutable). The CI gate
`evals/check-runtime-evidence.sh` validates every `runtime-evidence/**/*.yaml`
against this schema.

---

## Schema

```yaml
schema_version: "1.0"

# Every evidence record, regardless of kind, MUST carry these fields.
required_fields_all:
  - evidence_id        # stable unique id (e.g. ev-2026-06-21-0001)
  - kind               # one of evidence_kinds below
  - timestamp          # ISO-8601 UTC, when the evidence was observed
  - source             # attributable emitter — Incident Evidence Principle (C-96)
  - binds_to           # >= 1 C-doc id this evidence pertains to — Runtime Visibility (C-96)

field_rules:
  evidence_id:
    pattern: "^ev-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{3,}$"
  kind:
    enum: [metric, health_snapshot, incident, slo_breach]
  timestamp:
    format: iso-8601-utc            # e.g. 2026-06-21T18:37:21Z
  source:
    description: >
      identifies WHICH runtime emitted the evidence. Must be non-empty.
      Recommended form: "<service-or-app>[:<component>]"
      e.g. tec-api-gateway, tec-app:PlatformHealthContext
  binds_to:
    description: >
      list of C-doc ids (e.g. [C-96, C-92]) declaring the claim/obligation this
      evidence is evidence FOR. Each id MUST resolve to an existing C-doc.
    min_items: 1

# Kind-specific required fields (in addition to required_fields_all).
evidence_kinds:
  metric:
    required: [name, value, unit]
    note: a sampled runtime measurement (e.g. p95 latency, error rate).
  health_snapshot:
    required: [phs, dimensions]      # PHS = Platform Health Score (C-92)
    note: point-in-time health per C-92 dimensions; phs is 0..10.
  incident:
    required: [severity, summary, status]
    severity_enum: [P0, P1, P2, P3]
    status_enum:   [open, mitigated, resolved]
    note: a runtime failure; must be attributable + bound (C-96 Incident Evidence).
  slo_breach:
    required: [slo, observed, threshold]
    note: an SLO target violation (C-78 SLOs); binds_to should include C-78.

verification:
  authority_tier: V-5                # Operational Authority (VAM)
  consumer: C-93                     # Institutional Verification Constitution
  governs_via: C-99                  # Institutional Governance Constitution

binding_rules:
  - id: RE-1
    rule: every record carries all required_fields_all
  - id: RE-2
    rule: kind is one of evidence_kinds
  - id: RE-3
    rule: kind-specific required fields are present
  - id: RE-4
    rule: source is non-empty (attributable — C-96 Incident Evidence Principle)
  - id: RE-5
    rule: every binds_to id resolves to an existing C-doc (no dangling claims)
  - id: RE-6
    rule: evidence_id is unique across runtime-evidence/
```

