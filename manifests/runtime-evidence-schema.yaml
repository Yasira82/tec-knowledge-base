## Status

`[Planned State]` — the schema + CI validator are live now (the contract is ready).
Real evidence records begin when the Observability stack (Prometheus/SLOs, infra/ops)
starts emitting into `runtime-evidence/`. Until then the `examples/` prove the
contract end-to-end and the gate stays green.
