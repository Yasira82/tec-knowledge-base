## Open Questions (Deferred to Phase B3)

1. **How is V-1 (Founder Authority) delegated?** If the founder is unavailable, can a designated reviewer exercise V-2?
2. **VP-04 (External Audit) cost?** How often is it required? Per-release, per-quarter, per-annum?
3. **VP-07 (Assumed) policy:** Should documents with VP-07 be allowed in `main` branch, or only in `draft/`?
4. **VAM automation:** Should `check-vam-compliance.sh` be a Phase B3 deliverable, or wait until Track C observability provides runtime evidence?

