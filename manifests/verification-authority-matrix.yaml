## Verification Requirements by Document Tier

| Document Tier | Minimum Verification Policy | Minimum Authority Tier |
|---------------|----------------------------|------------------------|
| Tier 1 — Constitution (C-00 → C-02) | VP-01 + VP-04 (external audit before Portal) | V-1 (Founder) |
| Tier 2 — Architecture (C-10 → C-19) | VP-01 + VP-02 | V-2 (Constitutional) |
| Tier 3 — Backend (C-20 → C-23) | VP-02 + VP-03 | V-4 (Engineering) |
| Tier 4 — Vision (C-30 → C-32) | VP-01 | V-2 |
| Tier 5 — Engineering (C-40 → C-49) | VP-02 | V-4 |
| Tier 6 — Patterns (C-50 → C-78) | VP-01 | V-6 |
| Tier 7 — Institutional (C-79 → C-92) | VP-01 + VP-03 (where applicable) | V-2 |
| Tier 8 — Op Loop (C-93 → C-99) | VP-01 + ADR | V-2 |
| Tier 9 — App Charters (C-100 → C-115) | VP-01 + VP-02 (for live apps) | V-4 (for live) / V-2 (for planned) |
| Tier 10 — Authority Automation (C-116) | VP-02 + VP-05 | V-2 |

