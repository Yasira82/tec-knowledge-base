## Verification Workflow

```
Author writes/updates document
  ↓
Author declares Verification State in document header
  ↓
PR opened
  ↓
CI checks:
  1. Verification State declared?           (check-truth-framework.sh)
  2. Verification Policy matches required?  (check-vam-compliance.sh — NEW Phase B3)
  3. Authority Tier of verifier adequate?   (check-vam-compliance.sh)
  ↓
If gap declared in VAM → PR labeled `verification-gap` → requires governance review
If no gap → PR auto-mergeable (after other CI passes)
```

