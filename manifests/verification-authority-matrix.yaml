# TEC Verification Authority Matrix (VAM) v1.0

> **Version:** v1.0 — June 2026 (Session 11)
> **Truth State:** `[Planned State]`
> **Governance State:** `[Draft]`
> **Verification:** `[Documentation Verified]`
> **Authority Scope:** `[Platform]`
> **Parent Constitution:** C-93 Institutional Verification Constitution

---

## Purpose

C-93 declares that "Authority without Verification = Opinion". But verification without an authority matrix = inconsistency. This manifest defines **who can verify what, using which policy, at what confidence level**.

The VAM is the second pillar of C-116 Authority Automation (the first being the CDG). Together:

```
CDG  →  WHAT documents exist and how they relate
VAM  →  WHO can verify them and HOW
AHV  →  WHETHER the relationships are consistent
```

---

## Verification Authority Tiers

| Tier | Title | Held By | Can Verify |
|------|-------|---------|------------|
| V-1 | Founder Authority | Yasser (CEO) | Everything — final say |
| V-2 | Constitutional Authority | Platform Governance Layer (founder + ADR) | Constitutional docs (C-00, C-47, C-67, C-93–C-99) |
| V-3 | Architectural Authority | ADR-approved decisions | ADRs (C-64) + Kernel Spec (C-47) |
| V-4 | Engineering Authority | Code-verified inspection (Session 9 pattern) | Backend services, apps, infra config |
| V-5 | Operational Authority | Runtime evidence (live system behavior) | SLOs, incidents, health checks |
| V-6 | Documentation Authority | Documentation review (peer or self) | Internal docs, guides, templates |
| V-7 | External Authority | External auditor (Pi Network, third-party) | Pre-Portal audit, security audit |

---

## Verification Policies

Each verification claim MUST declare which policy was used:

| Policy ID | Name | Description | Confidence |
|-----------|------|-------------|------------|
| VP-01 | `documentation_review` | Document read and approved by qualified authority | Medium |
| VP-02 | `code_inspection` | Code in repository matches the documented behavior | High |
| VP-03 | `runtime_evidence` | Live system behavior confirms the documented behavior | Highest |
| VP-04 | `external_audit` | Third-party auditor has reviewed and accepted | Highest |
| VP-05 | `automated_test` | CI test suite passes for this behavior | High |
| VP-06 | `chaos_test` | Chaos test confirms behavior under failure | High |
| VP-07 | `assumed` | No verification — explicit assumption | None |

