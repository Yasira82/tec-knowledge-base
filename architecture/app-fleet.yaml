# TEC App Fleet Registry — single source of truth for "what app is at what stage"
# ---------------------------------------------------------------------------
# Authority: C-01 (Project Identity, canonical for Portal identity §4) + each
#            app's Institutional Charter (see `charter`).
# Truth State: [Current State] — all 24 apps registered + live on Mainnet.
#
# WHY THIS FILE EXISTS: every session was re-deriving domain / APP_SOURCE slug /
# App-ID / Hub-enablement / charter number per app from scattered CLAUDE.md files.
# This is the one place. Update it whenever an app changes stage.
#
# status legend:
#   live-verified          deployed + a real Pi payment verified in production
#   live-readonly-gated    deployed + real-Pi subscription works, BUT the app's
#                          high-risk financial mechanics stay read-only/simulated
#                          by charter until legal + payment-service custody + SYSTEM
#                          (FundX pools · Insure escrow · Brookfield investment/REITs)
#
# hub_enabled = present in Hub /api/auth/sso ALLOWED_TARGETS (SSO login works).
# payment_mode: dual = ADR-007 Mode1(Hub)+Mode2(standalone) real Pi (subscription).
#
# ⚠️ "live" = the Pro/subscription payment surface processes real Pi. It does NOT
#    mean escrow/pool/REIT custody is live — those are Invariant-#8 hard-gated.
# ---------------------------------------------------------------------------

meta:
  version: 2
  last_updated: "2026-07-16"
  canonical_identity: knowledge-base/C-01_Project_Identity.md   # §4 = all 24 App IDs
  milestone: >
    All 24 apps registered + deployed + live on Mainnet with real Pi (subscriptions).
    Financial mechanics (FundX pools / Insure escrow / Brookfield investment/REITs)
    remain hard-gated + read-only per charter (legal + payment-service custody + SYSTEM).

