# TEC App Fleet Registry — single source of truth for "what app is at what stage"
# ---------------------------------------------------------------------------
# Authority: C-01 (Project Identity, canonical for Portal identity §4) + each
#            app's Institutional Charter (see `charter`).
# Truth State: [Current State] for status/hub_enabled; [Planned State]/[Future
#            Vision] for apps whose pi_app_id is `pending`.
#
# WHY THIS FILE EXISTS: every session was re-deriving domain / APP_SOURCE slug /
# App-ID / Hub-enablement / charter number per app from scattered CLAUDE.md files.
# This is the one place. Update it whenever an app changes stage.
#
# status legend:
#   live-verified          deployed + a real Pi payment verified in production
#   registered-not-deployed Pi App ID registered, app not yet deployed
#   scaffold-v1            customized scaffold + V0/V1 read-only slice; App ID pending
#   template-raw           raw tec-template-base clone; charter defined; not customized
#   charter-only           charter written; no repo yet
#
# hub_enabled = present in Hub /api/auth/sso ALLOWED_TARGETS (SSO login works).
# payment_mode: dual = ADR-007 Mode1(Hub)+Mode2(standalone); none = no buy flow.
# ---------------------------------------------------------------------------

meta:
  version: 1
  last_updated: "2026-07-16"
  canonical_identity: knowledge-base/C-01_Project_Identity.md   # §4 = Portal-registered only
  gate_note: >
    pi_app_id: pending means NOT Portal-ready — do not add to C-01 §4 until a real
    <slug>-<16hex> App ID exists (check-portal-readiness enforces §4).

